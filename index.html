<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drengsson — from story to screen</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="description" content="Drengsson — storytelling, production, campaigns, web." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0a;
    --fg:#f4f1ea;
    --muted:#9a9488;
    --line:#3a3630;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--fg);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', -apple-system, sans-serif;
    padding:24px;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:28px;
  }
  .mark{
    position:relative;
    width:96px;
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mark::before,
  .mark::after,
  .mark .c3,
  .mark .c4{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    border-color:var(--fg);
    border-style:solid;
    opacity:.85;
  }
  .mark::before{ /* top-left */
    top:0; left:0;
    border-width:1.5px 0 0 1.5px;
  }
  .mark::after{ /* bottom-right */
    bottom:0; right:0;
    border-width:0 1.5px 1.5px 0;
  }
  .mark .c3{ /* top-right */
    top:0; right:0;
    border-width:1.5px 1.5px 0 0;
  }
  .mark .c4{ /* bottom-left */
    bottom:0; left:0;
    border-width:0 0 1.5px 1.5px;
  }
  .mark span{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:40px;
    line-height:1;
    transform:translateY(-2px);
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:400;
    font-size:clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing:0.02em;
    margin:0;
  }
  .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.05rem;
    color:var(--muted);
    margin:0;
  }
  .services{
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin:6px 0 0;
  }
  .divider{
    width:36px;
    height:1px;
    background:var(--line);
    margin:4px 0;
  }
  .contact{
    font-size:0.85rem;
    color:var(--muted);
  }
  .contact a{
    color:var(--fg);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:1px;
  }
  .contact a:hover{
    border-color:var(--fg);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mark">
      <span>D</span>
      <div class="c3"></div>
      <div class="c4"></div>
    </div>
    <div>
      <h1>Drengsson</h1>
      <p class="tagline">from story to screen</p>
    </div>
    <p class="services">Storytelling &nbsp;·&nbsp; Production &nbsp;·&nbsp; Campaigns &nbsp;·&nbsp; Web</p>
    <div class="divider"></div>
    <p class="contact">Site in progress — reach me at <a href="mailto:drengsson@gmail.com">drengsson@gmail.com</a></p>
  </div>
</body>
</html>
